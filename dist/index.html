<html lang="en">
	<head>

		<title>Event Horizon | Deep Space Observatory</title>

olor:#fff;font-variant-numeric:tabular-nums}input[type=range]{accent-color:#f5f5f5;cursor:pointer;width:100%;height:3px;margin:0 0 22px;display:block}.theme-switcher{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:16px;display:grid}.mode-switcher{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 14px;display:grid}.quality-switcher{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 14px;display:grid}.quality-switcher button{color:#dedede;letter-spacing:.06em;background:0 0;border-color:#ffffff3d;min-height:38px;font-size:8px}.quality-switcher button[aria-pressed=true]{color:#090909;background:#f5f5f5}#planet-orbit-lines{color:#dedede;background:0 0;border-color:#ffffff4d;min-height:34px;margin:0 0 10px;font-size:9px}.mode-switcher button{color:#dedede;letter-spacing:.08em;background:0 0;border-color:#ffffff3d;min-height:32px;font-size:9px}.mode-switcher button[aria-pressed=true]{color:#090909;background:#f5f5f5}.theme-switcher button{color:#dedede;letter-spacing:.035em;background:0 0;border-color:#ffffff3d;justify-content:center;align-items:center;gap:5px;min-width:0;min-height:34px;padding:0 4px;font-size:8px;display:flex}.theme-switcher button:before{background:var(--swatch);content:"";border-radius:50%;flex:0 0 6px;width:6px;height:6px}.theme-switcher button[aria-pressed=true]{color:#090909;background:#f5f5f5}#audio-toggle{color:#dedede;background:0 0;border-color:#ffffff4d;margin-top:8px}#audio-toggle[aria-pressed=true]{color:#fff;border-color:#fff}.trajectory-readout{color:#a9dfff;letter-spacing:.1em;margin:-8px 0 16px;font-size:9px}.photo-tools{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px;display:grid}.photo-tools button{color:#dedede;letter-spacing:.06em;background:0 0;border-color:#ffffff3d;min-height:34px;padding:0 5px;font-size:9px}#turbulence-toggle[aria-pressed=false]{color:#a0a0a0;background:0 0;border-color:#ffffff3d}.hud-grid-overlay{z-index:0;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at var(--hud-x,50%) var(--hud-y,50%), #000 8%, transparent 78%);mask-image:radial-gradient(ellipse at var(--hud-x,50%) var(--hud-y,50%), #000 8%, transparent 78%);background-image:linear-gradient(#6cd1ff1c 1px,#0000 1px),linear-gradient(90deg,#6cd1ff1c 1px,#0000 1px);background-size:48px 48px;display:none;position:fixed;inset:0}.hud-grid-overlay.is-visible{display:block}.hud-grid-overlay:before,.hud-grid-overlay:after{top:var(--hud-y,50%);left:var(--hud-x,50%);content:"";border:1px solid #75ddff94;border-radius:50%;position:absolute;transform:translate(-50%,-50%);box-shadow:0 0 18px #34c0ff47}.hud-grid-overlay:before{aspect-ratio:1;width:min(34vw,280px)}.hud-grid-overlay:after{aspect-ratio:1;border-style:dashed;width:min(16vw,132px)}.photo-capture .ui-panel,.photo-capture .hud-grid-overlay{visibility:hidden!important}button{color:#090909;width:100%;min-height:42px;font:inherit;letter-spacing:.12em;cursor:pointer;background:#f5f5f5;border:1px solid #f5f5f5;border-radius:4px;font-size:11px;font-weight:700;transition:background .14s,color .14s}button:hover{color:#f5f5f5;background:0 0}button:focus-visible,input:focus-visible{outline-offset:4px;outline:2px solid #fff}@media (width<=760px){.ui-panel{overscroll-behavior:contain;touch-action:pan-y;width:auto;max-height:min(48dvh,420px);padding:14px;inset:auto 8px 8px}.ui-panel h1{margin-bottom:12px}.ui-panel button,.quality-switcher button{min-height:44px}input[type=range]{touch-action:pan-x;min-height:26px;margin-bottom:12px}#show-ui{right:max(12px, env(safe-area-inset-right));bottom:max(12px, env(safe-area-inset-bottom));min-height:46px}}@media (width<=380px){.ui-panel{max-height:52dvh;padding:12px}.theme-switcher button{font-size:7px}}</style>
		<script type="module" crossorigin src="/assets/index-COPTMzp6.js"></script>
	</head>
	<body>
		<main id="canvas-container" aria-label="Interactive black hole scene"></main>
		<section class="ui-panel" aria-labelledby="panel-title">
			<p class="eyebrow">Deep space observatory</p>
			<h1 id="panel-title">EVENT HORIZON</h1>
			<section class="physics-readout" aria-labelledby="time-title">
				<h2 id="time-title">TIME DILATION</h2>
				<div class="time-row">
					<span>EARTH TIME</span>
					<output id="earth-time">00:00.0</output>
					<span></span>
				</div>
				<div class="time-row">
					<span>EVENT HORIZON</span>
					<output id="horizon-time">00:00.0</output>
					<output id="dilation-rate">1.00×</output>
				</div>
			</section>
			<label class="control-heading" for="mass-slider">
				<span>Mass</span>
				<output id="mass-value" for="mass-slider">50%</output>
			</label>
			<input id="mass-slider" type="range" min="10" max="100" value="50" />
			<output class="trajectory-readout" id="trajectory-result">MOVE POINTER TO PREDICT</output>
			<label class="control-heading" for="spin-speed">
				<span>Disk spin speed</span>
				<output class="control-output" id="spin-value" for="spin-speed">1.0×</output>
			</label>
			<input id="spin-speed" type="range" min="0.2" max="3" step="0.1" value="1" />
			<label class="control-heading" for="particle-density">
				<span>Particle density</span>
				<output class="control-output" id="density-value" for="particle-density">80%</output>
			</label>
			<input id="particle-density" type="range" min="10" max="100" step="5" value="80" />
			<label class="control-heading" for="galaxy-density">
				<span>Galaxy density</span>
				<output class="control-output" id="galaxy-density-value" for="galaxy-density">75%</output>
			</label>
			<input id="galaxy-density" type="range" min="10" max="100" step="5" value="75" />
			<label class="control-heading" for="planet-orbit-speed">
				<span>Planet orbit speed</span>
				<output class="control-output" id="planet-speed-value" for="planet-orbit-speed">1.0x</output>
			</label>
			<input id="planet-orbit-speed" type="range" min="0.2" max="3" step="0.1" value="1" />
			<label class="control-heading" for="disk-thickness">
				<span>Disk thickness</span>
				<output class="control-output" id="thickness-value" for="disk-thickness">1.0x</output>
			</label>
			<input id="disk-thickness" type="range" min="0.3" max="2.2" step="0.1" value="1" />
			<label class="control-heading" for="core-temperature">
				<span>Core temperature</span>
				<output class="control-output" id="temperature-value" for="core-temperature">1.3x</output>
			</label>
			<input id="core-temperature" type="range" min="0.5" max="2.5" step="0.1" value="1.3" />
			<button id="turbulence-toggle" type="button" aria-pressed="true">TURBULENCE NOISE: ON</button>
			<div class="theme-switcher" role="group" aria-label="Color theme">
				<button type="button" data-theme="interstellar" aria-pressed="true" style="--swatch: #ff9a38">INTERSTELLAR</button>
				<button type="button" data-theme="magnetar" aria-pressed="false" style="--swatch: #43cfff">MAGNETAR</button>
				<button type="button" data-theme="supernova" aria-pressed="false" style="--swatch: #ff4b85">SUPERNOVA</button>
			</div>
			<div class="mode-switcher" role="group" aria-label="Camera mode">
				<button type="button" data-camera-mode="orbit" aria-pressed="true">ORBIT</button>
				<button type="button" data-camera-mode="cinematic" aria-pressed="false">CINEMATIC</button>
			</div>
			<div class="quality-switcher" role="group" aria-label="Performance quality">
				<button type="button" data-quality="auto" aria-pressed="true">AUTO</button>
				<button type="button" data-quality="low" aria-pressed="false">LOW</button>
				<button type="button" data-quality="high" aria-pressed="false">HIGH</button>
				<button type="button" data-quality="ultra" aria-pressed="false">ULTRA</button>
			</div>
			<button id="planet-orbit-lines" type="button" aria-pressed="false">SHOW ORBIT LINES</button>
			<button id="spawn-matter" type="button">SPAWN MATTER</button>
			<button id="spawn-planet" type="button">SPAWN PLANET</button>
			<button id="audio-toggle" type="button" aria-pressed="false">ENABLE SPACE AUDIO</button>
			<div class="photo-tools">
				<button id="photo-mode" type="button">PHOTO MODE</button>
				<button id="hud-grid-toggle" type="button" aria-pressed="false">HUD GRID</button>
			</div>
			<button id="hide-ui" type="button">HIDE UI</button>
		</section>
		<div id="hud-grid-overlay" class="hud-grid-overlay" aria-hidden="true"></div>
		<button id="show-ui" type="button" aria-hidden="true">SHOW UI</button>
	</body>
</html>
